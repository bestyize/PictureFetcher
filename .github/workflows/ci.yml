name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: OLED conversion regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run portable conversion tests
        run: dotnet run --project tests/PictureFetcher.Core.Tests/PictureFetcher.Core.Tests.csproj --configuration Release

  desktop:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            executable: PictureFetcher.exe
          - rid: linux-x64
            os: ubuntu-latest
            executable: PictureFetcher
          - rid: osx-arm64
            os: macos-15
            executable: PictureFetcher
          - rid: osx-x64
            os: macos-15
            executable: PictureFetcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file desktop app
        shell: bash
        run: |
          dotnet publish PictureFetcher.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=false \
            -p:PublishTrimmed=false \
            -p:DebugType=None -p:DebugSymbols=false \
            -o publish/${{ matrix.rid }}
      - name: Check bundle payload
        shell: bash
        run: |
          test -s "publish/${{ matrix.rid }}/${{ matrix.executable }}"
      - name: Record uncompressed payload size
        shell: bash
        run: |
          du -sh "publish/${{ matrix.rid }}" || true
