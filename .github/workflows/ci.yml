name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: OLED conversion regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run portable conversion tests
        run: dotnet run --project tests/PictureFetcher.Core.Tests/PictureFetcher.Core.Tests.csproj --configuration Release

  desktop:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            executable: PictureFetcher.exe
          - rid: linux-x64
            os: ubuntu-latest
            executable: PictureFetcher
          - rid: osx-arm64
            os: macos-15
            executable: PictureFetcher
          - rid: osx-x64
            os: macos-15
            executable: PictureFetcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file desktop app
        shell: bash
        run: |
          bash packaging/publish.sh "${{ matrix.rid }}" "publish/${{ matrix.rid }}" partial-trim
      - name: Check bundle payload
        shell: bash
        run: |
          test -s "publish/${{ matrix.rid }}/${{ matrix.executable }}"
      - name: Verify macOS .app signing and DMG packaging
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: bash packaging/macos/package.sh "${{ matrix.rid }}" "ci-${{ github.run_number }}" "publish/${{ matrix.rid }}"
      - name: Verify Linux tarball packaging
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: bash packaging/linux/package.sh "ci-${{ github.run_number }}" publish/linux-x64
      - name: Verify Windows ZIP packaging
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath release-assets/PictureFetcher-ci-win-x64.zip
      - name: Measure packaged distribution size
        shell: bash
        run: |
          ls -lh release-assets/
          test -n "$(find release-assets -type f -size +1M -print -quit)"
      - name: Verify trimmed OLED controls, controller exports and bilingual resources
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          set +e
          timeout 35s xvfb-run -a env PICTUREFETCHER_UI_SMOKE=1 \
            ./publish/linux-x64/PictureFetcher > /tmp/picturefetcher-smoke.log 2>&1
          result=$?
          set -e
          cat /tmp/picturefetcher-smoke.log
          echo "UI smoke exit code: $result"
          test "$result" -eq 0
      - name: Record uncompressed payload size
        shell: bash
        run: |
          du -sh "publish/${{ matrix.rid }}" || true
