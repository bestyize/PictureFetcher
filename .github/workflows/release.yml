name: Release

on:
  push:
    branches:
      - master
    paths:
      - VERSION
      - RELEASE_TRIGGER
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picturefetcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-15
          - rid: osx-x64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set release label from VERSION
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          echo "RELEASE_LABEL=v$version" >> "$GITHUB_ENV"
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file binary
        shell: bash
        run: |
          bash packaging/publish.sh "${{ matrix.rid }}" "publish/${{ matrix.rid }}" partial-trim

      - name: Pack Windows x64 ZIP
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "release-assets/PictureFetcher-$env:RELEASE_LABEL-win-x64.zip" -Force

      - name: Pack Linux x64 tarball
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: bash packaging/linux/package.sh "$RELEASE_LABEL" publish/linux-x64

      - name: Pack and optionally notarize macOS DMG
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash packaging/macos/package.sh "${{ matrix.rid }}" "$RELEASE_LABEL" "publish/${{ matrix.rid }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PictureFetcher-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4

      - name: Validate version and resolve release tag
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(tr -d '\r\n' < VERSION)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
            project_version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' PictureFetcher.csproj)"
            [[ "$version" == "$project_version" ]] || { echo "VERSION and csproj disagree" >&2; exit 1; }
            tag="v$version"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unsupported release tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag after packages succeed
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          # Query git refs rather than parsing a REST 404 error body as a tag SHA.
          current="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$current" ]]; then
            [[ "$current" == "$GITHUB_SHA" ]] || { echo "Tag $TAG already targets another commit ($current)" >&2; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Exclude unnotarized macOS distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release-assets/*.dmg; do
            if [[ ! -f "$dmg.notarized" ]]; then
              echo "CI-only unsigned/unnotarized DMG will NOT be published: $dmg"
              rm -f "$dmg"
            else
              echo "Validated notarized distribution: $dmg"
            fi
          done
          rm -f release-assets/*.dmg.notarized

      - name: Write SHA-256 checksums for published files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/*.tar.gz release-assets/*.dmg)
          (("${#files[@]}" > 0)) || { echo "No release archives available" >&2; exit 1; }
          sha256sum "${files[@]}" | sed 's#release-assets/##' > release-assets/SHA256SUMS.txt
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PictureFetcher ${{ steps.release_version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
